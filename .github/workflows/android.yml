name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install Android NDK r23b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/android-ndk.zip" https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
      - name: Set up x86-64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      - name: Build for Android 9 on ARM64
        run: |
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -v "$RUNNER_TEMP/android-ndk-r23b:/ndk:ro" \
            -w /work ubuntu:24.04 \
            /ndk/ndk-build \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_PROJECT_PATH=. \
            APP_PLATFORM=android-28 \
            APP_ABI=arm64-v8a
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: fm-bridge-android-9-arm64
          path: libs/
          if-no-files-found: error
