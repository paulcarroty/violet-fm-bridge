image: ubuntu:20.04

variables:
  ANDROID_NDK_VERSION: "r23b"

before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget file tar unzip lib32stdc++6 lib32z1
  - wget --quiet --output-document=android-ndk.zip https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
  - unzip android-ndk.zip
  - export ANDROID_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}
  - export PATH=$ANDROID_HOME:${ANDROID_HOME}/prebuilt/linux-x86_64/bin/:$PATH

stages:
  - build

build_bridge:
  stage: build
  script:
    - ndk-build APP_BUILD_SCRIPT=./Android.mk NDK_PROJECT_PATH=.
  artifacts:
    paths:
      - libs/
